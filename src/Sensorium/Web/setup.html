<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Nur lokale Inhalte: Profile können keine Bilder, Schriften oder Daten aus dem Internet nachladen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Sensorium – Einrichtung</title>
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/setup.css">
</head>
<body class="setup">
<aside id="su-rail">
  <div class="brand"><span class="logo"></span>Sensorium</div>
  <ol id="su-steps"></ol>
  <div class="ver" id="su-ver"></div>
</aside>
<main id="su-main">
  <section id="su-view"></section>
  <footer id="su-foot">
    <button id="su-back" class="ghost">Zurück</button>
    <span class="grow"></span>
    <button id="su-skip" class="link" title="Der Assistent lässt sich jederzeit über das Symbol unten rechts wieder öffnen">Später einrichten</button>
    <button id="su-next" class="primary">Weiter</button>
  </footer>
</main>
<div id="su-toast" hidden></div>
<script src="js/core.js"></script>
<script src="js/widgets.js"></script>
<script src="js/demo.js"></script>
<script src="js/themes.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
